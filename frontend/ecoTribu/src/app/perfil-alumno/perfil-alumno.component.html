<main class="alumno-shell min-h-screen bg-[#ececec] text-slate-900">
  <div class="ambient ambient-top"></div>
  <div class="ambient ambient-bottom"></div>

  <header class="bg-emerald-700 px-6 py-6 text-white shadow-[0_8px_26px_rgba(12,95,69,0.22)] sm:px-10">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="rounded-lg bg-white/15 p-1.5 ring-1 ring-white/25">
          <img ngSrc="/img/EcoTribu Blanco.png" width="28" height="28" alt="Logo EcoTribu" priority />
        </div>
        <span class="brand-title text-2xl font-bold">EcoTribu</span>
      </div>
      <p class="text-base font-semibold tracking-wide sm:text-2xl">Perfil del Alumno</p>
    </div>
  </header>

  <section class="relative mx-auto w-full max-w-6xl px-6 py-8 sm:px-10 md:py-10">
    <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
      <h1 class="text-4xl font-black text-emerald-700 sm:text-6xl">Reporte de Progreso</h1>
      <div class="session-chip rounded-full border border-emerald-200 bg-white px-4 py-2 text-sm font-bold text-emerald-800 shadow-sm">
        {{ sesion?.nombre || 'Alumno' }}
      </div>
    </div>

    <div *ngIf="mensajeError" class="mb-5 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-amber-800">
      {{ mensajeError }}
    </div>

    <article class="filter-surface mb-6 rounded-[2rem] bg-gradient-to-br from-cyan-100 via-cyan-50 to-amber-100 px-5 py-6 shadow-[0_10px_26px_rgba(15,23,42,0.08)] sm:px-8 sm:py-7">
      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-[1fr_1fr_1fr_1fr_auto] lg:items-end">
        <div>
          <p class="pt-2 text-lg font-black text-emerald-700 sm:text-2xl">Filtros de Reportes</p>
          <p class="mt-1 text-sm text-emerald-700/80">Consulta tu avance actualizado</p>
        </div>

        <label class="block">
          <span class="mb-1 block text-xl font-black text-emerald-700">Alumno</span>
          <select class="field-select" disabled>
            <option>{{ sesion?.nombre || 'Actual' }}</option>
          </select>
        </label>

        <label class="block">
          <span class="mb-1 block text-xl font-black text-emerald-700">Centro educativo</span>
          <select class="field-select" disabled>
            <option>{{ sesion?.escuela?.nombre || 'Escuela' }}</option>
          </select>
        </label>

        <label class="block">
          <span class="mb-1 block text-xl font-black text-emerald-700">Reto/Quiz</span>
          <select class="field-select" disabled>
            <option>Todos</option>
          </select>
        </label>

        <button type="button" class="btn-generate h-14 rounded-2xl px-9 text-2xl font-black text-white" (click)="cargarReporte()" [disabled]="cargando">
          {{ cargando ? 'Cargando...' : 'Generar' }}
        </button>
      </div>
    </article>

    <article class="stats-wrap mb-7 rounded-[1.35rem] bg-emerald-700 px-5 py-6 sm:px-7 sm:py-7">
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div *ngFor="let metrica of metricas" class="metric-card rounded-xl bg-white px-4 py-4 shadow-sm">
          <p class="text-lg font-black text-slate-900 sm:text-3xl">{{ metrica.titulo }}</p>
          <p class="metric-value mt-1 text-4xl font-black text-orange-500 sm:text-5xl">{{ metrica.valor }}</p>
        </div>
      </div>
    </article>

    <article class="chart-surface rounded-[2rem] bg-gradient-to-br from-cyan-100 via-cyan-50 to-amber-100 px-5 py-7 sm:px-8 sm:py-8">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h2 class="text-2xl font-black text-slate-900 sm:text-4xl">Graficos de progreso de actividades</h2>
        <div class="chart-legend rounded-full border border-emerald-200 bg-white/80 px-4 py-2 text-sm font-semibold text-emerald-800">
          <span class="legend-dot"></span>
          Rendimiento por actividad
        </div>
      </div>

      <div class="mx-auto grid max-w-4xl grid-cols-5 items-end gap-4 border-b border-emerald-200/80 pt-2 sm:gap-7">
        <div *ngFor="let actividad of actividades" class="flex flex-col items-center">
          <div class="bar-track flex h-52 w-full items-end rounded-md p-1 sm:h-56">
            <div class="bar-fill w-full rounded-xs bg-emerald-700" [style.height.%]="actividad.porcentaje"></div>
          </div>
          <p class="mt-3 text-center text-base font-black text-slate-900 sm:text-2xl">{{ actividad.nombre }}</p>
        </div>
      </div>
    </article>
  </section>
</main>
