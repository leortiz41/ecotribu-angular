<main class="min-h-screen bg-[#ececec] text-slate-900">
  <header class="bg-emerald-700 px-6 py-6 text-white shadow-[0_8px_26px_rgba(12,95,69,0.22)] sm:px-10">
    <div class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="rounded-lg bg-white/15 p-1.5 ring-1 ring-white/25">
          <img ngSrc="/img/EcoTribu Blanco.png" width="28" height="28" alt="Logo EcoTribu" priority />
        </div>
        <span class="brand-title text-2xl font-bold">EcoTribu</span>
      </div>
      <p class="text-base font-semibold sm:text-2xl">{{ sesion?.nombre || 'Perfil del Alumno' }}</p>
    </div>
  </header>

  <section class="mx-auto w-full max-w-6xl px-6 py-8 sm:px-10 md:py-10">
    <h1 class="mb-7 text-4xl font-black text-emerald-700 sm:text-5xl">Reporte de Progreso</h1>

    <div *ngIf="mensajeError" class="mb-5 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-amber-800">
      {{ mensajeError }}
    </div>

    <article class="mb-6 rounded-[2.1rem] bg-gradient-to-b from-cyan-200 to-amber-100 px-5 py-6 shadow-[0_10px_26px_rgba(15,23,42,0.08)] sm:px-8">
      <div class="grid gap-4 lg:grid-cols-[1fr_1fr_1fr_1fr_auto] lg:items-end">
        <div>
          <p class="text-lg font-black text-emerald-700 sm:text-xl">Filtros de Reportes</p>
        </div>

        <label class="block">
          <span class="mb-1 block text-base font-bold text-emerald-700">Alumno</span>
          <select class="field-select" disabled>
            <option>{{ sesion?.nombre || 'Actual' }}</option>
          </select>
        </label>

        <label class="block">
          <span class="mb-1 block text-base font-bold text-emerald-700">Centro educativo</span>
          <select class="field-select" disabled>
            <option>{{ sesion?.escuela?.nombre || 'Escuela' }}</option>
          </select>
        </label>

        <label class="block">
          <span class="mb-1 block text-base font-bold text-emerald-700">Reto/Quiz</span>
          <select class="field-select" disabled>
            <option>Todos</option>
          </select>
        </label>

        <button type="button" class="btn-generate h-12 rounded-2xl px-8 text-xl font-extrabold text-white" (click)="cargarReporte()" [disabled]="cargando">
          {{ cargando ? 'Cargando...' : 'Generar' }}
        </button>
      </div>
    </article>

    <article class="mb-6 rounded-[1.35rem] bg-emerald-700 px-5 py-6 sm:px-7 sm:py-7">
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
        <div *ngFor="let metrica of metricas" class="rounded-xl bg-white px-4 py-4 shadow-sm">
          <p class="text-2xl font-black text-slate-900">{{ metrica.titulo }}</p>
          <p class="mt-2 text-4xl font-black text-orange-500">{{ metrica.valor }}</p>
        </div>
      </div>
    </article>

    <article class="rounded-[2.1rem] bg-gradient-to-b from-cyan-200 to-amber-100 px-5 py-7 sm:px-8 sm:py-8">
      <h2 class="mb-6 text-2xl font-black text-slate-900 sm:text-3xl">Gráficos de progreso de actividades</h2>

      <div class="mx-auto grid max-w-4xl grid-cols-5 items-end gap-4 pt-2 sm:gap-7">
        <div *ngFor="let actividad of actividades" class="flex flex-col items-center">
          <div class="bar-track flex h-52 w-full items-end rounded-md bg-white/35 p-1 sm:h-56">
            <div class="bar-fill w-full rounded-sm bg-emerald-700" [style.height.%]="actividad.porcentaje"></div>
          </div>
          <p class="mt-3 text-center text-lg font-black text-slate-900 sm:text-2xl">{{ actividad.nombre }}</p>
        </div>
      </div>
    </article>
  </section>
</main>
